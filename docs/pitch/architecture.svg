<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" width="1600" height="970" role="img" aria-labelledby="t d" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Arhitectura MedHaven: LLM doar la margini</title>
  <desc id="d">Două telefoane trimit JSON către backend-ul cu motor determinist, solver și kb.sqlite; portalul medicului citește același backend; un LLM e folosit doar ca rezervă la citirea pozei sau a textului; sursele de date sunt DDInter 2.0, nomenclatorul românesc și Beers, STOPP, ACB.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a35a00"/></marker>
  </defs>

  <rect width="1600" height="970" fill="#f7f5f2"/>
  <text x="40" y="62" font-size="42" font-weight="700" fill="#1a1a1a">MedHaven: decizia medicală e deterministă</text>

  <!-- telefoane -->
  <g stroke="#0e6b68" stroke-width="3" fill="#ffffff">
    <rect x="40" y="110" width="440" height="190" rx="18"/>
    <rect x="40" y="340" width="440" height="190" rx="18"/>
  </g>
  <g fill="#1a1a1a">
    <text x="64" y="160" font-size="32" font-weight="700" fill="#0e6b68">Telefonul Mariei</text>
    <text x="64" y="204" font-size="26">Modul senior: Acum,</text>
    <text x="64" y="238" font-size="26">„Am luat”, check-in vocal</text>
    <text x="64" y="274" font-size="24" fill="#5a5a5a">OCR și voce pe telefon</text>
    <text x="64" y="390" font-size="32" font-weight="700" fill="#0e6b68">Telefonul Anei</text>
    <text x="64" y="434" font-size="26">Aparținător: scanare,</text>
    <text x="64" y="468" font-size="26">alerte, graf, Noutăți</text>
    <text x="64" y="504" font-size="24" fill="#5a5a5a">VisionKit + OCR pe telefon</text>
  </g>

  <!-- telefon -> backend -->
  <g stroke="#1a1a1a" stroke-width="3" fill="none">
    <path d="M480 205 H600" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <path d="M480 435 H600" marker-end="url(#ar)" marker-start="url(#ar)"/>
  </g>
  <text x="540" y="322" font-size="21" text-anchor="middle" fill="#5a5a5a">HTTP JSON</text>

  <!-- backend -->
  <rect x="600" y="110" width="560" height="560" rx="18" fill="#e3f0ef" stroke="#0e6b68" stroke-width="3"/>
  <text x="628" y="158" font-size="32" font-weight="700" fill="#0e6b68">Backend (FastAPI)</text>
  <g fill="#ffffff" stroke="#0e6b68" stroke-width="2">
    <rect x="628" y="184" width="504" height="96" rx="12"/>
    <rect x="628" y="300" width="504" height="124" rx="12"/>
    <rect x="628" y="444" width="504" height="86" rx="12"/>
  </g>
  <rect x="628" y="550" width="504" height="92" rx="12" fill="#0e6b68"/>
  <g fill="#1a1a1a" font-size="26">
    <text x="648" y="222" font-weight="700">Extragere</text>
    <text x="648" y="256" font-size="24">text OCR → nomenclator RO</text>
    <text x="648" y="338" font-weight="700">Motor determinist</text>
    <text x="648" y="372" font-size="24">interacțiuni · dubluri · Beers</text>
    <text x="648" y="404" font-size="24">STOPP · ACB → alerte cu sursă</text>
    <text x="648" y="482" font-weight="700">Solver de program</text>
    <text x="648" y="514" font-size="24">constrângeri, fără LLM</text>
    <text x="648" y="590" font-weight="700" fill="#ffffff">kb.sqlite</text>
    <text x="648" y="624" font-size="24" fill="#ffffff">produse RO, substanțe, reguli</text>
  </g>

  <!-- portal -->
  <rect x="1260" y="110" width="300" height="190" rx="18" fill="#ffffff" stroke="#0e6b68" stroke-width="3"/>
  <g fill="#1a1a1a">
    <text x="1284" y="160" font-size="29" font-weight="700" fill="#0e6b68">Portalul medicului</text>
    <text x="1284" y="204" font-size="26">web, fără instalare</text>
    <text x="1284" y="238" font-size="26">decizie + notă</text>
    <text x="1284" y="272" font-size="26">→ înapoi la familie</text>
  </g>
  <path d="M1160 205 H1260" stroke="#1a1a1a" stroke-width="3" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>

  <!-- LLM -->
  <rect x="1260" y="350" width="300" height="230" rx="18" fill="#fff1d6" stroke="#a35a00" stroke-width="4" stroke-dasharray="14 8"/>
  <g fill="#1a1a1a">
    <text x="1284" y="400" font-size="32" font-weight="700" fill="#a35a00">LLM (Gemini)</text>
    <text x="1284" y="442" font-size="28" font-weight="700">doar la margini</text>
    <text x="1284" y="482" font-size="24">citirea pozei / a textului,</text>
    <text x="1284" y="514" font-size="24">doar dacă potrivirea</text>
    <text x="1284" y="546" font-size="24">în nomenclator eșuează</text>
  </g>
  <path d="M1260 440 L1150 250" stroke="#a35a00" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#aa)"/>
  <text x="1262" y="618" font-size="24" fill="#a35a00" font-weight="700">rezultatul trece oricum</text>
  <text x="1262" y="648" font-size="24" fill="#a35a00" font-weight="700">prin aceleași verificări</text>

  <!-- surse -->
  <g stroke="#0e6b68" stroke-width="2" fill="#ffffff">
    <rect x="40" y="740" width="480" height="120" rx="14"/>
    <rect x="560" y="740" width="480" height="120" rx="14"/>
    <rect x="1080" y="740" width="480" height="120" rx="14"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="280" y="790" font-size="30" font-weight="700">DDInter 2.0</text>
    <text x="280" y="832" font-size="24" fill="#5a5a5a">CC BY-NC-SA 4.0</text>
    <text x="800" y="790" font-size="30" font-weight="700">Nomenclatorul RO</text>
    <text x="800" y="832" font-size="24" fill="#5a5a5a">catalog public, Min. Sănătății</text>
    <text x="1320" y="790" font-size="30" font-weight="700">Beers / STOPP / ACB</text>
    <text x="1320" y="832" font-size="24" fill="#5a5a5a">reguli scrise de mână, cu sursă</text>
  </g>
  <g stroke="#0e6b68" stroke-width="3" fill="none">
    <path d="M280 740 V706 H760 V646"/>
    <path d="M800 740 V646"/>
    <path d="M1320 740 V706 H1020 V646"/>
  </g>
  <g fill="#0e6b68"><path d="M752 650 L760 636 L768 650z"/><path d="M792 650 L800 636 L808 650z"/><path d="M1012 650 L1020 636 L1028 650z"/></g>
  <text x="40" y="712" font-size="26" font-weight="700" fill="#0e6b68">Surse de date</text>

  <text x="40" y="906" font-size="26" fill="#1a1a1a">Linia întreruptă portocalie = singurul loc unde poate intra un LLM.</text>
  <text x="40" y="942" font-size="26" fill="#1a1a1a">Dacă există o interacțiune și cât de gravă e: doar baze de date și reguli.</text>
</svg>
