<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graf</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               -webkit-user-select: none; -webkit-touch-callout: none; }
  #cy { position: absolute; inset: 0; }
</style>
<script src="cytoscape.min.js"></script>
<script src="graph-core.js"></script>
</head>
<body>
<div id="cy"></div>
<script>
// Graful din aplicație. Desenul e în graph-core.js (copia identică a celui din portal, QA2); pagina doar
// primește JSON-ul Cytoscape (contracts/schema/graph.schema.json) prin window.pgRender(...) și trimite înapoi
// atingerile: messageHandlers.alert (id-ul alertei de pe muchie) și messageHandlers.med (id-ul medicamentului).
(function () {
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  const contrast = window.matchMedia('(prefers-contrast: more)');
  let graph = null;

  function post(name, value) {
    const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[name];
    if (handler) handler.postMessage(value);
  }

  function theme() { return { dark: dark.matches, contrast: contrast.matches }; }

  window.pgRender = (elements) => {
    if (graph) graph.destroy();
    graph = window.pgMount(document.getElementById('cy'), elements, Object.assign(theme(), {
      onAlert: (id) => post('alert', id),
      onMed: (id) => post('med', id),
      onReady: (count) => post('ready', count),
    }));
  };
  // butonul „Recentrează” din aplicație: înapoi la tot graful, centrat
  window.pgResetView = (animated) => { if (graph) graph.reset(animated); };

  [dark, contrast].forEach((mq) => mq.addEventListener('change', () => { if (graph) graph.setTheme(theme()); }));
  window.addEventListener('resize', () => { if (graph) graph.resize(); });
})();
</script>
</body>
</html>
